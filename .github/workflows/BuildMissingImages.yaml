name: Build new images

on:
  schedule:
    # Every Wednesday at 06:00 UTC (after Patch Tuesday) - rebuilds dev images if a new base image is available
    - cron: '0 6 * * 3'
  workflow_dispatch:
    inputs:
      PushToProd:
        description: Push to production (Y/N)
        type: boolean

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: PowerShell

jobs:
  CheckBaseImages:
    runs-on: [ windows-latest ]
    outputs:
      newBaseAvailable: ${{ steps.check.outputs.newBaseAvailable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for new base image
        id: check
        env:
          eventName: ${{ github.event_name }}
        run: |
          # Manual (and any non-scheduled) triggers skip the check and always build.
          # Scheduled runs only build when a new base image is available.
          if ($env:eventName -eq 'schedule') {
              . ${{ github.workspace }}/build/checknewbaseimage.ps1
          }
          else {
              Add-Content -encoding utf8 -Path $env:GITHUB_OUTPUT -Value "newBaseAvailable=true"
          }

  AnalyzeImages:
    runs-on: [ windows-latest ]
    needs: [ CheckBaseImages ]
    if: needs.CheckBaseImages.outputs.newBaseAvailable == 'true'
    outputs:
      genericTag: ${{ steps.Analyze.outputs.genericTag }}
      buildImagesJson: ${{ steps.Analyze.outputs.buildImagesJson }}
      digestsJson: ${{ steps.Analyze.outputs.digestsJson }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyze
        id: Analyze
        env:
          RUNNUMBEROFFSET: ${{ vars.RUNNUMBEROFFSET }}
          PushToProd: ${{ github.event.inputs.PushToProd }}
        run: |
          $pushToProd = $false
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
              $pushToProd = $env:PushToProd -eq 'True'
          }
          [int] $revisionNumber = ([int]($ENV:GITHUB_RUN_NUMBER) - [int]($ENV:RUNNUMBEROFFSET))

          . ${{ github.workspace }}/build/analyzeimages.ps1 `
                -RevisionNumber $revisionNumber `
                -PushToProd:$pushToProd

  BuildImages:
    runs-on: [ Windows-2025 ]
    needs: [ AnalyzeImages ]
    strategy:
      matrix:
        tag: ${{ fromJson(needs.AnalyzeImages.outputs.buildImagesJson) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Az CLI login'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            enable-AzPSSession: true

      - name: Build Image
        env:
          Tag: ${{ matrix.tag }}
          PushToProd: ${{ github.event.inputs.PushToProd }}
          GenericTag: ${{ needs.AnalyzeImages.outputs.genericTag }}
        run: |
          $filesonly = ($env:Tag -like '*-filesonly|*')
          $only24 = ($env:Tag -like '*-24|*' -or $env:Tag -like '*-24-filesonly|*')
          $baseImage = $env:Tag.split('|')[1]
          $ltscTag = $env:Tag.split('|')[2]

          $pushToProd = $false
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
              $pushToProd = $env:PushToProd -eq 'True'
          }

          . ${{ github.workspace }}/build/build.ps1 `
              -BaseImage $baseImage `
              -LtscTag $ltscTag `
              -FilesOnly $filesonly `
              -Only24 $only24 `
              -GenericTag $env:GenericTag `
              -PushToDev `
              -PushToProd:$pushToProd

  MarkOldImagesStale:
    runs-on: [ Windows-Latest ]
    needs: [ AnalyzeImages, BuildImages ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Az CLI login'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            enable-AzPSSession: true

      - name: MarkStale
        env:
          digestsJson: ${{ needs.AnalyzeImages.outputs.digestsJson }}
        shell: pwsh
        run: |
          $erroractionpreference = "STOP"
          $digests = $env:digestsJson | ConvertFrom-Json
          . ${{ github.workspace }}/build/markstale.ps1 -Digests $digests
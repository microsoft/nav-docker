name: Mark Images Stale

on:
  workflow_dispatch:
    inputs:
      SHAsToMarkStale:
        description: Enter SHAs to mark stale (comma separated)
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: PowerShell

jobs:
  MarkmagesStale:
    runs-on: [ Windows-Latest ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 'Az CLI login'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            enable-AzPSSession: true

      - name: MarkStale
        env:
          digests: ${{ inputs.SHAsToMarkStale }}
        shell: pwsh
        run: |
          $erroractionpreference = "STOP"
          $digests = "$env:digests".Split(",").Trim() | Select-Object -Unique
          . ${{ github.workspace }}/build/markstale.ps1 -Digests $digests

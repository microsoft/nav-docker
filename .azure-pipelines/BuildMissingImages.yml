# Azure Pipelines equivalent of .github/workflows/BuildMissingImages.yaml
#
# Prerequisites:
# - An Azure Resource Manager service connection (workload identity federation) with push access to
#   mcrbusinesscentral.azurecr.io. Set its name in the AzureServiceConnection variable below.
#   Add an approval check on the service connection to mirror the GitHub "Production" environment gate.
#   Only the Publish stage uses the service connection, so approvers can review the Analyze stage output first.
# - An agent pool able to run Hyper-V isolated containers with 8 GB memory (see BuildImagesPoolName).
#
# Revision numbers are allocated from the tags already published to mcr.microsoft.com/businesscentral
# (highest published revision for the current generic tag + 1).
# build.ps1 refuses to push a versioned tag that already exists in the push registry (and fails if it cannot verify
# that), so neither this pipeline nor the GitHub workflow can overwrite a published versioned tag.
# To serialize publishing across runs, add an "Exclusive Lock" check on the service connection
# (lockBehavior: sequential below). Only one publisher (this pipeline or the GitHub workflow) should be active.

name: $(Date:yyyyMMdd)$(Rev:.r)

lockBehavior: sequential

trigger: none
pr: none

parameters:
  - name: PushToProd
    displayName: Push to production
    type: boolean
    default: false
  # build.ps1 uses Hyper-V isolation with --memory 8G, which needs >= 16 GB RAM and nested virtualization.
  # Standard Microsoft-hosted agents (2 vCPU / 7 GB) are too small, so there is intentionally no default:
  # use e.g. a Managed DevOps Pool / 1ES pool with a suitable VM size.
  - name: BuildImagesPoolName
    displayName: Agent pool for building images (>= 16 GB RAM, nested virtualization)
    type: string

variables:
  - name: AzureServiceConnection
    value: nav-docker-production
  - name: PushRegistry
    value: mcrbusinesscentral.azurecr.io
  - name: PushToProd
    value: ${{ parameters.PushToProd }}

stages:
  - stage: Analyze
    displayName: Analyze images
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: AnalyzeImages
        displayName: Analyze images
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: PowerShell@2
            name: Analyze
            displayName: Analyze
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)
              script: |
                $pushToProd = $env:PUSHTOPROD -eq 'True'

                # Allocate the next revision from the published tags (format: osVersion-major.minor.build.revision[-suffix])
                $tagver = [System.Version](Get-Content -Raw -Path "$env:BUILD_SOURCESDIRECTORY/generic/tag.txt").Trim(@(13, 10, 32, 0xFEFF))
                $publishedTags = (Invoke-RestMethod -Uri 'https://mcr.microsoft.com/v2/businesscentral/tags/list').tags
                $versionPrefix = [regex]::Escape("$($tagver.Major).$($tagver.Minor).$($tagver.Build).")
                $publishedRevisions = @($publishedTags | ForEach-Object {
                    if ($_ -match "^\d+\.\d+\.\d+\.\d+-$versionPrefix(\d+)(-|$)") { [int]$Matches[1] }
                })
                [int] $revisionNumber = 0
                if ($publishedRevisions.Count -gt 0) {
                    $revisionNumber = ($publishedRevisions | Measure-Object -Maximum).Maximum + 1
                }
                Write-Host "Highest published revision: $(if ($publishedRevisions.Count -gt 0) { $revisionNumber - 1 } else { 'none' }), using $revisionNumber"

                . "$env:BUILD_SOURCESDIRECTORY/build/analyzeimages.ps1" `
                      -RevisionNumber $revisionNumber `
                      -PushToProd:$pushToProd

                # Azure Pipelines matrix requires an object of legs: { "legName": { "tag": "..." } }
                # Leg names may only contain letters, numbers and underscores and must start with a letter
                $matrix = [ordered]@{}
                $imagesBcTags | ForEach-Object {
                    $legName = "img_$($_.Split('|')[0] -replace '[^A-Za-z0-9_]', '_')"
                    $matrix[$legName] = @{ "tag" = $_ }
                }
                $buildImagesMatrix = ConvertTo-Json -InputObject $matrix -Compress
                Write-Host "buildImagesMatrix=$buildImagesMatrix"

                Write-Host "##vso[task.setvariable variable=genericTag;isOutput=true]$genericTag"
                Write-Host "##vso[task.setvariable variable=digestsJson;isOutput=true]$digestsJson"
                Write-Host "##vso[task.setvariable variable=buildImagesJson;isOutput=true]$buildImagesJson"
                Write-Host "##vso[task.setvariable variable=buildImagesMatrix;isOutput=true]$buildImagesMatrix"

  # Uses the service connection, so its approval check is requested here, after analysis.
  # Skipped (no approval requested) when there are no missing images.
  - stage: Publish
    displayName: Build and publish images
    dependsOn: Analyze
    condition: >-
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(coalesce(dependencies.Analyze.outputs['AnalyzeImages.Analyze.buildImagesMatrix'], '{}'), '{}')
      )
    jobs:
      - job: BuildImages
        displayName: Build image
        timeoutInMinutes: 360
        pool:
          name: ${{ parameters.BuildImagesPoolName }}
        strategy:
          matrix: $[ coalesce(stageDependencies.Analyze.AnalyzeImages.outputs['Analyze.buildImagesMatrix'], '{}') ]
        variables:
          GenericTag: $[ stageDependencies.Analyze.AnalyzeImages.outputs['Analyze.genericTag'] ]
          # Job-specific Docker config, so registry credentials from az acr login don't persist on the agent
          DockerConfigDir: $(Agent.TempDirectory)\docker-config-$(System.JobId)
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build image
            inputs:
              azureSubscription: $(AzureServiceConnection)
              scriptType: ps
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                $filesonly = ($env:IMAGETAG -like '*-filesonly|*')
                $only24 = ($env:IMAGETAG -like '*-24|*' -or $env:IMAGETAG -like '*-24-filesonly|*')
                $baseImage = $env:IMAGETAG.split('|')[1]
                $ltscTag = $env:IMAGETAG.split('|')[2]
                $pushToProd = $env:PUSHTOPROD -eq 'True'

                . "$env:BUILD_SOURCESDIRECTORY/build/build.ps1" `
                    -BaseImage $baseImage `
                    -LtscTag $ltscTag `
                    -FilesOnly $filesonly `
                    -Only24 $only24 `
                    -GenericTag $env:GENERICTAG `
                    -PushRegistry $env:PUSHREGISTRY `
                    -PushToDev `
                    -PushToProd:$pushToProd
            env:
              IMAGETAG: $(tag)
              DOCKER_CONFIG: $(DockerConfigDir)

          - task: PowerShell@2
            displayName: Remove registry credentials
            condition: always()
            inputs:
              targetType: inline
              script: |
                # Log out first, as Docker may have stored the token in a credential helper (e.g. wincred) outside DOCKER_CONFIG
                $env:DOCKER_CONFIG = $env:DOCKERCONFIGDIR
                docker logout $env:PUSHREGISTRY
                if (Test-Path $env:DOCKERCONFIGDIR) { Remove-Item -Recurse -Force $env:DOCKERCONFIGDIR }
                exit 0

      - job: MarkOldImagesStale
        displayName: Mark old images stale
        dependsOn: BuildImages
        pool:
          vmImage: windows-latest
        variables:
          DigestsJson: $[ stageDependencies.Analyze.AnalyzeImages.outputs['Analyze.digestsJson'] ]
          DockerConfigDir: $(Agent.TempDirectory)\docker-config-$(System.JobId)
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Mark stale
            inputs:
              azureSubscription: $(AzureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                $erroractionpreference = "STOP"
                $digests = $env:DIGESTSJSON | ConvertFrom-Json
                . "$env:BUILD_SOURCESDIRECTORY/build/markstale.ps1" -Digests $digests -PushRegistry $env:PUSHREGISTRY
            env:
              DOCKER_CONFIG: $(DockerConfigDir)

          - task: PowerShell@2
            displayName: Remove registry credentials
            condition: always()
            inputs:
              targetType: inline
              script: |
                # Log out first, as Docker may have stored the token in a credential helper (e.g. wincred) outside DOCKER_CONFIG
                $env:DOCKER_CONFIG = $env:DOCKERCONFIGDIR
                docker logout $env:PUSHREGISTRY
                if (Test-Path $env:DOCKERCONFIGDIR) { Remove-Item -Recurse -Force $env:DOCKERCONFIGDIR }
                exit 0
